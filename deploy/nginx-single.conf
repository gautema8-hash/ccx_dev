# ============================================================
# 单节点部署：Nginx 配置
# 适用：试点 / 单店 / 小规模阶段
#
# 使用：
#   cp deploy/nginx-single.conf /etc/nginx/conf.d/lbz.conf
#   nginx -t && systemctl reload nginx
#
# TODO: 把 server_name 换成真实域名；证书路径换成你的证书
# ============================================================

upstream lbz_order {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # TODO: 换成真实证书（推荐 certbot 自动续期）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 安全响应头（应用层已加，这里再加一层纵深防御）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 1m;   # 接口只收 JSON，256KB 上限由应用层控制

    # ---- 静态资源（上传目录）：带缓存，减少回源 ----
    location /uploads/ {
        proxy_pass http://lbz_order;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        proxy_set_header Host $host;
    }

    # ---- 管理后台 ----
    location = /admin {
        proxy_pass http://lbz_order;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- API ----
    location / {
        proxy_pass http://lbz_order;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 关键：限流按真实客户端 IP 计，否则所有用户被算成同一个 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 失败重试到下一个 upstream（单节点时无效，保留以便平滑升级为集群）
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # 探针不记访问日志，避免日志噪音
    location = /health { access_log off; proxy_pass http://lbz_order; }
    location = /ready  { access_log off; proxy_pass http://lbz_order; }

    access_log /var/log/nginx/lbz-access.log;
    error_log  /var/log/nginx/lbz-error.log warn;
}
