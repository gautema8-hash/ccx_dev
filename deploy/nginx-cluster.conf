# ============================================================
# 多节点集群部署：Nginx 负载均衡配置
# 适用：面向全国用户的生产环境
#
# 使用：
#   cp deploy/nginx-cluster.conf /etc/nginx/conf.d/lbz.conf
#   nginx -t && systemctl reload nginx
#
# 前置条件（缺一不可）：
#   1. 后端实例全部无状态（已满足：JWT 无 Session）
#   2. Redis 为所有实例共享（限流 / 锁 / 幂等 / 缓存）
#   3. 上传目录已迁移对象存储，或挂载共享存储（否则头像会 404）
#   4. 反向代理必须带 X-Forwarded-For（限流按真实 IP）
# ============================================================

# 应用集群：按实际实例地址填写
upstream lbz_order {
    # least_conn：订单类请求耗时差异大，最少连接比轮询更均衡
    least_conn;

    server 10.0.1.11:3000 max_fails=3 fail_timeout=10s;
    server 10.0.1.12:3000 max_fails=3 fail_timeout=10s;
    server 10.0.1.13:3000 max_fails=3 fail_timeout=10s;
    # 需要扩容时：加一行 server 即可，配合优雅关闭不影响在线请求
    # server 10.0.1.14:3000 max_fails=3 fail_timeout=10s;

    keepalive 64;
}

# 请求限流：防刷兜底（应用层已有细粒度限流，这里是入口层粗粒度）
# TODO: 阈值需按全国实际流量评估后调整
limit_req_zone $binary_remote_addr zone=lbz_api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=lbz_admin:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=lbz_conn:10m;

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # TODO: 换成真实证书
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 1m;
    limit_conn lbz_conn 100;

    # ---------- 管理后台（限流更严） ----------
    location /admin {
        limit_req zone=lbz_admin burst=10 nodelay;
        proxy_pass http://lbz_order;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /miniapp/v1/admin/ {
        limit_req zone=lbz_admin burst=20 nodelay;
        proxy_pass http://lbz_order;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 静态资源 ----------
    # 多节点下建议改为对象存储/CDN 回源，避免落到单点磁盘：
    # location /uploads/ { proxy_pass https://your-cdn-bucket; }
    location /uploads/ {
        proxy_pass http://lbz_order;
        expires 7d;
        proxy_set_header Host $host;
    }

    # ---------- 业务 API ----------
    location / {
        limit_req zone=lbz_api burst=100 nodelay;
        proxy_pass http://lbz_order;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 单实例故障（502/503/504）自动切换到下一个实例
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # ---------- 探针 ----------
    # LB / K8s 的健康检查打到 /ready：DB 不可用时返回 503，自动摘除节点
    location = /health { access_log off; proxy_pass http://lbz_order; }
    location = /ready  { access_log off; proxy_pass http://lbz_order; }

    # 灰度发布时可放开（配合 upstream 分组）：
    # split_clients "${remote_addr}" $lbz_upstream { 5% lbz_order_canary; * lbz_order; }

    access_log /var/log/nginx/lbz-access.log;
    error_log  /var/log/nginx/lbz-error.log warn;
}
